<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family:cursive, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            COLOR: #d30d0d9a;
            margin-bottom: 30px;
            letter-spacing: 2px;


        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .gallery img {
            width: 250px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: block;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>IMAGE GALLERY</h1>

    <div class="gallery">
        <div class="column">
