<style>
    body {
        color: white;
        font-family: Arial, sans-serif;
        background-color: #121212;
        background-image: url('https://images.unsplash.com/photo-1614851099511-773084f6911d?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Z3JhZGllbnQlMjBiYWNrZ3JvdW5kfGVufDB8fDB8fHww');

        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    .table-container {
        display: flex;
        justify-content: center;
        width: 100%;
        overflow-x: auto;
    }

    table {
        text-align: left;
        color: white;
        background-color: rgba(0, 0, 0, 0.7); 
        width: 100%;
        max-width: 1000px;
        min-width: 600px;
        border-collapse: collapse;
        transition: box-shadow 0.3s ease;
    }

    table:hover {
        box-shadow: 7px 7px 15px rgba(0,0,0,0.8);
    }

    th, td {
        border-bottom: 1px solid #555; 
        padding: 15px;
        white-space: nowrap;
    }
    
    th {
        background-color: rgba(255, 255, 255, 0.1);
        font-weight: bold;
    }

    tbody tr {
        transition: background-color 0.2s ease;
    }

    tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.2);
        cursor: pointer;
    }
</style>
</head>
