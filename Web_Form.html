<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
    <style>
        body {
            background: #ff6a49;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        h1 {
            color: white;
            letter-spacing: 2px;
            text-shadow: -2px -2px 0 #ff55a3, 2px 2px 0 #42e6f5;
        }
        main {
            display: flex;
            background: white;
            width: 700px;
            height: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        form {
            flex: 1;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        h2 { margin: 0; }
        hr { width: 80%; border: 1px solid #ff6a49; margin: 10px auto; }
        p { font-size: 12px; color: #555; margin-bottom: 25px; }
        label { font-size: 12px; font-weight: bold; text-align: left; margin-bottom: 5px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; outline-color: #ff6a49; }
        button { background: #ff6a49; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; }
        a { font-size: 12px; color: #333; text-decoration: none; font-weight: bold; margin-top: 20px; }
        .image-side {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=600') center/cover;
        }
    </style>
</head>
<body>

    <h1>LOGIN FORM PAGE</h1>

    <main>
        <form>
            <h2>LOGIN</h2>
            <hr>
            <p>Explore the World!</p>
            
            <label>Email</label>
            <input type="email" placeholder="abc@exampl.com">
            
            <label>Password</label>
            <input type="password" placeholder="enter your password">
            
            <button type="submit">Submit</button>
            <a href="#">Forgot Password?</a>
        </form>

        <div class="image-side"></div>
    </main>

</body>
</html>
